-serif" font-size="13" fill="#444">Serum TG</text><rect x="787.4" y="450" width="72.6" height="24" rx="3" fill="#2a7f9e"/><text x="781.4" y="467" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#333">-0.22</text><text x="747.4" y="506" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#444">Steatosis grade</text><rect x="860.0" y="490" width="92.4" height="24" rx="3" fill="#c8553d"/><text x="958.4" y="507" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#333">+0.28</text><text x="747.4" y="546" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#444">NAS</text><rect x="860.0" y="530" width="132.0" height="24" rx="3" fill="#c8553d"/><text x="998.0" y="547" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#333">+0.40</text><text x="600" y="620" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f3a5f">Take-home</text><text x="600" y="646" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#333">Circulating metabolites do not mirror the liver: median liver–serum ρ = 0.02 across 40 matched metabolites.</text><text x="600" y="670" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#333">Hepatic amino acids are lower with lobular inflammation without serum change (6 of 6 discordant amino acids, robust to adjustment).</text><text x="600" y="694" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#333">Genetic hepatic lipid retention (discordant pPRS) raises hepatic and lowers serum triglycerides; effects on histology are largely mediated by liver fat.</text><text x="600" y="718" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#333">Serum adds little to clinical discrimination; hepatic metabolites add a lot (steatosis AUC 0.73 → 0.91).</text></svg>