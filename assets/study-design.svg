<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430"><rect width="1200" height="430" fill="#fff"/><text x="600" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3a5f">Study design and data layers</text><rect x="430" y="50" width="340" height="60" rx="10" fill="#1f3a5f"/><text x="600.0" y="76.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">MAFALDA cohort</text><text x="600.0" y="96.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#fff">211 adults, severe obesity, protocol liver biopsy</text><text x="190" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c8553d">LIVER</text><text x="600" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2a7f9e">SERUM / GENETICS</text><rect x="40" y="165" width="300" height="58" rx="10" fill="#c8553d"/><text x="190.0" y="190.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Transcriptome</text><text x="190.0" y="210.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#fff">RNA-seq, n = 208 (Fig. 1)</text><rect x="40" y="235" width="300" height="58" rx="10" fill="#c8553d"/><text x="190.0" y="260.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Lipidome</text><text x="190.0" y="280.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#fff">UHPLC-QTOFMS (Table S3)</text><rect x="40" y="305" width="300" height="58" rx="10" fill="#c8553d"/><text x="190.0" y="330.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Polar metabolome</text><text x="190.0" y="350.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#fff">701 features (Fig. 2, Table S4)</text><rect x="440" y="165" width="320" height="58" rx="10" fill="#2a7f9e"/><text x="600.0" y="190.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Serum polar metabolome</text><text x="600.0" y="210.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#fff">653 features, n = 209 (Fig. 2)</text><rect x="440" y="235" width="320" height="58" rx="10" fill="#5a4b9a"/><text x="600.0" y="260.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Partitioned PRS</text><text x="600.0" y="280.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#fff">concordant / discordant, n = 211 (Fig. 5)</text><rect x="440" y="305" width="320" height="58" rx="10" fill="#1f3a5f"/><text x="600.0" y="330.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Paired liver–serum</text><text x="600.0" y="350.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#fff">187 participants, 40 matched metabolites (Fig. 4)</text><text x="1000" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#8a94a0">EXTERNAL COHORTS</text><rect x="860" y="165" width="280" height="58" rx="10" fill="#8a94a0"/><text x="1000.0" y="190.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">GSE135251, GSE162694</text><text x="1000.0" y="210.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#fff">liver transcriptome (Fig. 3)</text><rect x="860" y="235" width="280" height="58" rx="10" fill="#8a94a0"/><text x="1000.0" y="260.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">ST000915</text><text x="1000.0" y="280.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#fff">liver lipidomics (Fig. 3)</text><rect x="860" y="305" width="280" height="58" rx="10" fill="#8a94a0"/><text x="1000.0" y="330.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">ST001711 (EPoS)</text><text x="1000.0" y="350.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#fff">serum metabolomics (Tables S19–S20)</text><path d="M600 110V122M190 122H1000M190 122V128M600 122V128M1000 122V128" stroke="#8a94a0" stroke-width="2" fill="none"/><text x="600" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#555">Fig. 6 integrates hepatic transcripts, lipids, metabolites and their serum counterparts on liver–blood exchange pathways.</text></svg>